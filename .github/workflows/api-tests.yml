name: API Tests

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: |
          pip install -r tests/requirements.txt
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate Helm chart
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Helm lint
        run: |
          helm lint src/kubernetes/helm
          helm lint src/kubernetes/helm --set istio.enabled=true --set database.persistence.enabled=false --set kafka.persistence.enabled=false --set zookeeper.persistence.enabled=false
      - name: Start services
        run: |
          docker compose up -d --build --wait --wait-timeout 240
          for url in http://localhost:8080/health http://localhost:8081/api/movies/health http://localhost:8082/api/events/health http://localhost:8000/health; do
            curl --fail --retry 30 --retry-delay 2 --retry-all-errors "$url"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/postman/package-lock.json
      - name: Postman tests
        working-directory: tests/postman
        run: npm ci && npm run test:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: tests/postman/reports/
      - name: Service logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
