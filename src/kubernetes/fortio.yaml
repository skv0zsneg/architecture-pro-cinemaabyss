apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio-deploy
  namespace: cinemaabyss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true,"proxyStatsMatcher":{"inclusionRegexps":[".*upstream_rq_pending.*",".*upstream_cx_overflow.*"]}}'
    spec:
      containers:
        - name: fortio
          image: fortio/fortio:latest
          args: [server]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
